name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build Next.js frontend in CI (avoids OOM on small EC2)
      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        env:
          NEXT_PUBLIC_STRAPI_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # Upload standalone build to EC2 (no node_modules needed on server)
      - name: Upload standalone build
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".next/standalone,public"
          target: /home/ubuntu/dl-web-standalone-new
          strip_components: 0

      - name: Upload static assets
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".next/static"
          target: /home/ubuntu/dl-web-standalone-new/.next
          strip_components: 1

      # Deploy backend + restart both services
      - name: Deploy backend & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Backend
            cd ~/dl-web
            git pull origin main
            cd dl-backend
            npm install --production=false
            npm run build
            pm2 restart dl-backend

            # Swap in new frontend build
            rm -rf ~/dl-web-standalone
            mv ~/dl-web-standalone-new/.next/standalone ~/dl-web-standalone
            cp -r ~/dl-web-standalone-new/public ~/dl-web-standalone/
            mkdir -p ~/dl-web-standalone/.next
            cp -r ~/dl-web-standalone-new/.next/static ~/dl-web-standalone/.next/
            rm -rf ~/dl-web-standalone-new

            pm2 restart dl-frontend
            pm2 save
